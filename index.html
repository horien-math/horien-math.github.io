<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Important pour les mobiles -->
    <title>Let's Math It ! - Connexion</title>
    <!-- On lie le fichier de style -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="logo-icon">📐</div>
            <h1>Let's Math It !</h1>
            <p>Veuillez entrer vos identifiants pour accéder aux cours.</p>
            
            <div class="form-group">
                <input type="text" id="username" placeholder="Nom d'utilisateur">
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Mot de passe">
            </div>
            
            <button onclick="verifierConnexion()">Se connecter</button>
        </div>
    </div>

    <!-- Le pied de page demandé -->
    <footer>&copy; Horien 2026</footer>

    <script src="script.js"></script>
</body>
</html>
